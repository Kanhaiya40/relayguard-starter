services:
  - type: web
    name: relayguard-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PGHOST
        fromDatabase:
          name: relayguard-demo-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: relayguard-demo-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: relayguard-demo-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: relayguard-demo-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: relayguard-demo-db
          property: password
      - key: RELAYGUARD_EMAIL_NOTIFICATIONS_ENABLED
        value: "false"

databases:
  - name: relayguard-demo-db
    plan: free
    databaseName: relayguard
    user: relayguard
