spring:
  application:
    name: relayguard
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/relayguard}
    username: ${DATABASE_USERNAME:relayguard}
    password: ${DATABASE_PASSWORD:relayguard_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
server:
  port: ${PORT:8080}
relayguard:
  rate-limit:
    events-per-minute: ${RELAYGUARD_EVENTS_PER_MINUTE:600}
  retention:
    days: ${RELAYGUARD_RETENTION_DAYS:30}
    cleanup-interval-ms: ${RELAYGUARD_RETENTION_CLEANUP_INTERVAL_MS:3600000}
  ingest:
    max-request-bytes: ${RELAYGUARD_MAX_REQUEST_BYTES:1048576}
  quotas:
    events-per-workspace-month: ${RELAYGUARD_EVENTS_PER_WORKSPACE_MONTH:100000}
    warning-percent: 80
    destinations-per-project: 10
  delivery:
    enabled: ${RELAYGUARD_DELIVERY_ENABLED:true}
    poll-interval-ms: ${RELAYGUARD_DELIVERY_POLL_INTERVAL_MS:1000}
    max-attempts: ${RELAYGUARD_DELIVERY_MAX_ATTEMPTS:8}
    base-delay-ms: ${RELAYGUARD_DELIVERY_BASE_DELAY_MS:1000}
    max-delay-ms: ${RELAYGUARD_DELIVERY_MAX_DELAY_MS:3600000}
  notifications:
    email:
      enabled: ${RELAYGUARD_EMAIL_NOTIFICATIONS_ENABLED:false}
      worker-enabled: ${RELAYGUARD_EMAIL_NOTIFICATION_WORKER_ENABLED:${RELAYGUARD_EMAIL_NOTIFICATIONS_ENABLED:false}}
      from: ${RELAYGUARD_EMAIL_FROM:no-reply@relayguard.local}
      poll-interval-ms: ${RELAYGUARD_EMAIL_POLL_INTERVAL_MS:1000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
